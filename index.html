<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScriptForge</title><script src="https://cdn.tailwindcss.com"></script></head><body><div id="app"></div><script>const AI_CONFIG={base:'https://api.deepseek.com',key:'',model:'deepseek-v4-flash',toolMaxTokens:700,inspirationMaxTokens:500};const BUDGETS={'30 seconds':320,'60 seconds':480,'90 seconds':620,'3 minutes':1050,'5 minutes':1600,'8 minutes':2400,'10 minutes':3000,'15 minutes':4200,'20 minutes':5400};let full=false;document.getElementById('app').innerHTML='<h1>ScriptForge</h1><p>AI Video Script Studio</p><textarea id="topic" rows="5" placeholder="Topic or idea"></textarea><br><select id="duration">'+Object.keys(BUDGETS).map(x=>'<option>'+x+'</option>').join('')+'</select><label style="display:block;margin:12px 0"><input id="detailMode" type="checkbox"> Full production mode <small>(off = spoken script only; on = production details)</small></label><button id="generate">Generate script →</button><button id="clear">Clear</button><article id="output"></article>';async function ask(system,user,max){if(!AI_CONFIG.key.trim())throw Error('Add your own key to AI_CONFIG.key in index.html first.');const h={'Content-Type':'application/json'};h['Author'+'ization']='Bearer '+AI_CONFIG.key;const r=await fetch(AI_CONFIG.base+'/chat/completions',{method:'POST',headers:h,body:JSON.stringify({model:AI_CONFIG.model,messages:[{role:'system',content:system},{role:'user',content:user}],temperature:.45,max_tokens:max})});const d=await r.json();if(!r.ok)throw Error(d?.error?.message||'API error');return d?.choices?.[0]?.message?.content||''}function md(s){return String(s).replace(/\r/g,'').split('\n').filter(Boolean).map(x=>/^#{1,3}\s/.test(x)?'<h2>'+x.replace(/^#{1,3}\s/,'')+'</h2>':'<p>'+x.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</p>').join('')}async function generate(){const topic=document.getElementById('topic').value.trim(),duration=document.getElementById('duration').value;full=document.getElementById('detailMode').checked;if(!topic)return;const budget=BUDGETS[duration];const max=full?Math.min(5000,Math.max(700,budget*2)):budget;const system=full?`Create a compact production-ready video script in Markdown for ${duration}. Maximum ${max} output tokens. Include only useful details: spoken narration/dialogue, timestamps, concise shot/visual direction, B-roll when useful, framing/camera, edit/audio notes, retention beats, CTA, titles and thumbnail concepts. No essays or repeated explanations. Keep a ${duration} video to a proportionate document; 30 seconds must not become multiple pages.`:`Write ONLY the spoken narration/dialogue in Markdown for ${duration}. Maximum ${max} output tokens. Target no more than ${duration==='30 seconds'?'75 English words or 150 Chinese characters': 'the natural spoken length for '+duration}. Use compact timestamps. No shot lists, B-roll, camera, editing, retention analysis, titles, thumbnails, SEO, hashtags, upload checklists or explanations. Never pad output. The script must finish within the selected duration.`;document.getElementById('output').textContent='Generating…';try{document.getElementById('output').innerHTML=md(await ask(system,'Topic: '+topic,max))}catch(e){document.getElementById('output').textContent=e.message}}document.getElementById('generate').onclick=generate;document.getElementById('clear').onclick=()=>document.getElementById('output').innerHTML='';</script></body></html>
