<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScriptForge</title><script src="https://cdn.tailwindcss.com"></script><style>body{margin:0;background:#f6f7fb;color:#0f172a;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.glass{background:rgba(255,255,255,.94);backdrop-filter:blur(14px)}.hero{background:radial-gradient(circle at 10% 10%,#e0e7ff,transparent 35%),radial-gradient(circle at 90% 20%,#fce7f3,transparent 35%),#fff}.grad{background:linear-gradient(90deg,#4f46e5,#7c3aed,#db2777);-webkit-background-clip:text;background-clip:text;color:transparent}.card{background:#fff;border:1px solid #e2e8f0;border-radius:20px}.active{background:#111827!important;color:#fff!important}.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.md{line-height:1.7;overflow-wrap:anywhere}.md h1{font-size:1.8rem;font-weight:800;margin:1em 0 .5em}.md h2{font-size:1.3rem;font-weight:800}.md p{margin:.55em 0}#output{height:min(760px,calc(100vh - 190px));min-height:520px;overflow:auto}@media(max-width:1023px){#output{height:65vh;min-height:420px}}@media(max-width:640px){.hero{padding:1.25rem!important}.hero h1{font-size:2.15rem!important}.grid.grid-cols-2{grid-template-columns:1fr}#output{height:62vh;min-height:360px}.tool-scroll{overflow-x:auto;flex-wrap:nowrap!important}.tool-scroll button{white-space:nowrap}.creator-input{flex-direction:column}.creator-input button{width:100%}}@media print{header,main>.hero,main>.grid>section:first-child,main>section:last-child,footer,.no-print{display:none!important}body{background:#fff!important}main{max-width:none!important;padding:0!important;margin:0!important}.md{font-size:11pt;line-height:1.45}#output{display:block!important;height:auto!important;min-height:0!important;overflow:visible!important}}
</style></head><body><header class="sticky top-0 z-40 border-b border-slate-200 glass"><div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-600 to-violet-600 text-white grid place-items-center text-xl">✦</div><div><b>ScriptForge</b><div id="tag" class="text-xs text-slate-500"></div></div></div><div class="flex gap-2"><button id="history" class="px-3 py-2 rounded-lg text-sm"></button><button id="language" class="px-3 py-2 rounded-lg border bg-white text-sm"></button></div></div></header><main class="max-w-7xl mx-auto px-4 py-7"><section class="hero border rounded-3xl p-7 sm:p-10 mb-6"><span id="badge" class="text-xs font-bold text-indigo-700 bg-indigo-50 px-3 py-1 rounded-full"></span><h1 class="text-4xl sm:text-6xl font-black mt-4"><span id="hero1"></span> <span id="hero2" class="grad"></span></h1><p id="heroDesc" class="mt-4 max-w-3xl text-lg text-slate-600"></p></section><div class="grid lg:grid-cols-12 gap-6"><section class="lg:col-span-5 space-y-5"><div class="card p-5 shadow-sm"><div class="flex justify-between items-center mb-4"><h2 id="brief" class="font-black"></h2><button id="inspire" class="text-xs font-bold text-indigo-600"></button></div><label id="topicLabel" class="text-xs font-bold"></label><textarea id="topic" rows="4" class="mt-2 w-full border rounded-xl p-3 outline-none focus:ring-2 focus:ring-indigo-500"></textarea><div class="grid grid-cols-2 gap-3 mt-4"><div><label id="formatLabel" class="text-xs font-bold"></label><select id="format" class="mt-1 w-full border rounded-xl p-3"></select></div><div><label id="platformLabel" class="text-xs font-bold"></label><select id="platform" class="mt-1 w-full border rounded-xl p-3"></select></div><div><label id="durationLabel" class="text-xs font-bold"></label><select id="duration" class="mt-1 w-full border rounded-xl p-3"></select></div><div><label id="audienceLabel" class="text-xs font-bo  border-indigo-100 border-t-indigo-600 rounded-full spin mx-auto"></div><b id="loadingTitle" class="block mt-4"></b><p id="loadingDesc" class="text-xs text-slate-400"></p></div></div><article id="output" class="hidden md"></article></div></div></section></div><section class="card p-5 mt-6"><div class="flex flex-wrap gap-2 items-center"><b id="lab" class="mr-2"></b><div id="tools" class="flex flex-wrap gap-2 tool-scroll"></div></div><div class="flex gap-2 mt-4 creator-input"><input id="toolTopic" class="flex-1 border rounded-xl p-3"><button id="run" class="px-5 rounded-xl bg-indigo-600 text-white font-bold"></button></div><div id="toolOutput" class="md mt-5 max-h-[560px] overflow-auto"></div></section></main><footer id="footer" class="max-w-7xl mx-auto px-4 pb-8 text-xs text-slate-400"></footer><div id="modal" class="hidden fixed inset-0 z-50 bg-slate-950/50 p-4 items-center justify-center"><div class="bg-white rounded-2xl max-w-2xl w-full max-h-[88vh] overflow-auto p-6"><div class="flex justify-between"><div><h2 id="modalTitle" class="font-black text-xl"></h2><p id="modalDesc" class="text-sm text-slate-500 mt-1"></p></div><button id="close">✕</button></div><div id="modalBody" class="mt-5"></div></div></div><script>
const AI_CONFIG={base:'https://api.deepseek.com',key:'',model:'deepseek-v4-flash',toolMaxTokens:700,inspirationMaxTokens:500,maxTopicChars:1200};
const BUDGETS={'30 seconds':{tokens:320,words:75,chars:150,lines:'6-10'},'60 seconds':{tokens:480,words:150,chars:300,lines:'8-14'},'90 seconds':{tokens:620,words:225,chars:450,lines:'10-18'},'3 minutes':{tokens:1050,words:450,chars:900,lines:'18-30'},'5 minutes':{tokens:1600,words:750,chars:1500,lines:'30-45'},'8 minutes':{tokens:2400,words:1200,chars:2400,lines:'45-65'},'10 minutes':{tokens:3000,words:1500,chars:3000,lines:'55-80'},'15 minutes':{tokens:4200,words:2250,chars:4500,lines:'80-110'},'20 minutes':{tokens:5400,words:3000,chars:6000,lines:'100-140'}};
const I={en:{tag:'AI Video Script Studio',badge:'Built for creators',hero1:'Turn an idea into a',hero2:'usable script',heroDesc:'Generate only the words that should actually be spoken. Duration-aware and ready to record.',brief:'Creative brief',inspire:'✦ Inspire me',topic:'Topic or idea',ph:'e.g. Why most people waste the first hour of their day',format:'Format',platform:'Platform',duration:'Duration',audience:'Audience',tone:'Tone',goal:'Primary goal',intensity:'Hook intensity',captions:'Caption-friendly lines',broll:'B-roll suggestions',generate:'Generate script →',connection:'AI connection',connectionDesc:'Add your own key directly to AI_CONFIG.key in this file.',ready:'Ready',working:'Generating…',result:'Your script',copy:'Copy',copied:'Copied ✓',export:'Export',clear:'Clear',emptyTitle:'Your next video starts here',emptyDesc:'Enter a topic and generate only the spoken script.',loading:'Writing only the spoken words…',loadingDesc:'No shot lists, strategy essays or filler.',lab:'Creator Lab',run:'Run AI tool',toolph:'Use the current topic or enter another topic',history:'History',lang:'中文',error:'Error',noTopic:'Please enter a topic first.',noKey:'Add your own key to AI_CONFIG.key in index.html first.',noHistory:'No saved scripts yet.',ideasTitle:'AI Inspiration',ideasDesc:'Pick a topic to use it immediately.',footer:'ScriptForge · AI creator studio',tones:['High-energy','Smart & clear','Emotional','Cinematic','Funny','Bold & provocative'],tools:{hooks:'Hook Lab',titles:'Title Lab',retention:'Retention',shots:'Shot Planner',repurpose:'Repurpose',comments:'Comments',package:'Creator Package'}},zh:{tag:'AI 视频脚本工作室',badge:'为创作者打造',hero1:'把想法变成',hero2:'真正能直接说的脚本',heroDesc:'只生成真正需要说出来的内容。严格按视频时长控制，短而完整，可以直接录制。',brief:'创作需求',inspire:'✦ AI 灵感',topic:'主题或想法',ph:'例如：为什么大多数人浪费了每天的第一个小时',format:'内容形式',platform:'发布平台',duration:'视频时长',audience:'目标受众',tone:'内容风格',goal:'主要目标',intensity:'钩子强度',captions:'生成适合字幕的台词',broll:'加入 B-roll 建议',generate:'生成脚本 →',connection:'AI 连接',connectionDesc:'直接在本页面源码的 AI_CONFIG.key 中填写自己的密钥。',ready:'准备好了',working:'正在生成……',result:'你的脚本',copy:'复制',copied:'已复制 ✓',export:'导出',clear:'清空',emptyTitle:'你的下一个视频从这里开始',emptyDesc:'输入主题，只生成真正需要说的脚本。',loading:'只写真正要说的话……',loadingDesc:'不写分镜、不写策略长文、不写废话。',lab:'创作者工具箱',run:'运行 AI 工具',toolph:'使用当前主题或输入新的主题',history:'历史记录',lang:'English',error:'错误',noTopic:'请先输入视频主题。',noKey:'请先在 index.html 的 AI_CONFIG.key 中填入你自己的密钥。',noHistory:'暂无保存的脚本。',ideasTitle:'AI 灵感',ideasDesc:'点击一个主题，立即填入创作框。',footer:'ScriptForge · AI 创作者工作室',tones:['高能量','聪明清晰','情绪化','电影感','幽默','大胆犀利'],tools:{hooks:'钩子',titles:'标题',retention:'留存',shots:'分镜',repurpose:'再利用',comments:'评论',package:'发布包'}}};
const O={format:['Solo narration','Talking head','Storytelling','Mini documentary','Educational explainer','Product / UGC','Interview','Short-form drama'],platform:['YouTube','YouTube Shorts','TikTok','Instagram Reels','Podcast','LinkedIn','Bilibili','Custom'],duration:['30 seconds','60 seconds','90 seconds','3 minutes','5 minutes','8 minutes','10 minutes','15 minutes','20 minutes'],audience:['General audience','Beginners','Professionals','Gen Z','Business owners','Creators'],goal:['Views & retention','Followers','Comments & discussion','Leads / sales','Education','Personal brand'],intensity:['Extreme','Strong','Balanced','Soft']};const OZ={format:['单人口播','出镜讲解','故事讲述','迷你纪录片','知识讲解','产品 / 用户内容','访谈','短剧'],platform:['YouTube','YouTube Shorts','TikTok','Instagram Reels','播客','LinkedIn','哔哩哔哩','自定义'],duration:['30 秒','60 秒','90 秒','3 分钟','5 分钟','8 分钟','10 分钟','15 分钟','20 分钟'],audience:['大众观众','初学者','专业人士','Z 世代','企业主','内容创作者'],goal:['播放量与留存','涨粉','评论与讨论','获客与销售','知识教育','个人品牌'],intensity:['极强','强','平衡','柔和']};
let lang='en',tone='High-energy',last='',tool='hooks';const $=x=>document.getElementById(x),T=()=>I[lang];function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function inline(s){return esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>')}function md(v){return String(v??'').replace(/\r/g,'').split('\n').filter(x=>x.trim()).map(l=>{let h=l.match(/^(#{1,3})\s+(.*)$/);return h?`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`:'<p>'+inline(l)+'</p>'}).join('')}
function setup(){let t=T();[['tag','tag'],['badge','badge'],['hero1','hero1'],['hero2','hero2'],['heroDesc','heroDesc'],['brief','brief'],['inspire','inspire'],['topicLabel','topic'],['formatLabel','format'],['platformLabel','platform'],['durationLabel','duration'],['audienceLabel','audience'],['toneLabel','tone'],['goalLabel','goal'],['intensityLabel','intensity'],['captionsLabel','captions'],['brollLabel','broll'],['generate','generate'],['connection','connection'],['connectionDesc','connectionDesc'],['result','result'],['copy','copy'],['export','export'],['clear','clear'],['emptyTitle','emptyTitle'],['emptyDesc','emptyDesc'],['loadingTitle','loading'],['loadingDesc','loadingDesc'],['lab','lab'],['run','run'],['footer','footer']].forEach(([id,k])=>$(id).textContent=t[k]);$('topic').placeholder=t.ph;$('toolTopic').placeholder=t.toolph;$('history').textContent=t.history;$('language').textContent=t.lang;$('status').textContent=t.ready;Object.keys(O).forEach(k=>$(k).innerHTML=O[k].map((x,n)=>`<option value="${esc(x)}">${lang==='zh'?OZ[k][n]:x}</option>`).join(''));renderTones();renderTools();document.documentElement.lang=lang}function renderTones(){tone=tone||I.en.tones[0];$('tones').innerHTML=T().tones.map((x,i)=>`<button type="button" class="border rounded-xl p-2 text-xs font-bold ${I.en.tones[i]===tone?'active':''}" data-value="${I.en.tones[i]}">${x}</button>`).join('');document.querySelectorAll('#tones button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tones button').forEach(x=>x.classList.remove('active'));b.classList.add('active');tone=b.dataset.value})}function renderTools(){$('tools').innerHTML=Object.entries(T().tools).map(([k,v])=>`<button type="button" class="tool border rounded-lg px-3 py-2 text-xs font-bold ${k===tool?'active':''}" data-tool="${k}">${v}</button>`).join('');document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));b.classList.add('active');tool=b.dataset.tool})}function text(v){if(typeof v==='string')return v;if(Array.isArray(v))return v.map(x=>typeof x==='string'?x:(x?.text||x?.content||x?.value||'')).join('');if(v&&typeof v==='object')return v.text||v.content||v.value||'';return ''}
async function ask(system,user,max){if(!AI_CONFIG.key.trim())throw new Error(T().noKey);let headers={'Content-Type':'application/json'};headers['Author'+'ization']='Bearer '+AI_CONFIG.key;let r=await fetch(AI_CONFIG.base+'/chat/completions',{method:'POST',headers,body:JSON.stringify({model:AI_CONFIG.model,messages:[{role:'system',content:system},{role:'user',content:user}],temperature:.45,max_tokens:max})});let raw=await r.text(),d={};try{d=JSON.parse(raw)}catch{}if(!r.ok)throw new Error(d?.error?.message||raw||'HTTP '+r.status);let c=d?.choices?.[0],v=text(c?.message?.content)||text(c?.message?.reasoning_content)||text(c?.text)||text(d?.output_text)||text(d?.output);if(!v.trim())throw new Error('The API returned no readable text.');return v}
function brief(){return `Topic: ${$('topic').value.trim().slice(0,AI_CONFIG.maxTopicChars)}\nFormat: ${$('format').value}\nPlatform: ${$('platform').value}\nDuration: ${$('duration').value}\nAudience: ${$('audience').value}\nTone: ${tone}\nGoal: ${$('goal').value}\nHook intensity: ${$('intensity').value}\nLanguage: ${lang==='en'?'English':'Simplified Chinese'}`}function budget(){return BUDGETS[$('duration').value]||BUDGETS['30 seconds']}
function cleanScript(raw){let lines=String(raw||'').replace(/```(?:markdown)?/gi,'').replace(/```/g,'').split('\n').map(x=>x.trim()).filter(Boolean);let start=lines.findIndex(x=>/^#?\s*(script|full script|脚本)\s*$/i.test(x));if(start>=0)lines=lines.slice(start);let bad=/^(#{1,3}\s*)?(hooks?|titles?|retention|b-roll|shot|visual|thumbnail|description|seo|hashtags?|cta|upload|strategy|pattern|payoff|发布|标题|分镜|留存|缩略图|简介|标签|制作说明)/i;return lines.filter(x=>!bad.test(x)).join('\n').trim()}
async function generate(){if(!$('topic').value.trim())return alert(T().noTopic);let b=budget();$('generate').disabled=true;$('empty').classList.add('hidden');$('output').classList.add('hidden');$('loading').classList.remove('hidden');$('status').textContent=T().working;try{let system=`You are a professional video script writer. Write ONLY the spoken words. No production notes, shot lists, B-roll, strategy, titles, thumbnails, descriptions, SEO, hashtags, checklists or explanations. Output only Markdown with # Script and timestamped spoken lines. Selected duration: ${$('duration').value}. HARD maximum output tokens: ${b.tokens}. Target spoken length: no more than ${b.words} English words OR ${b.chars} Chinese characters. Use about ${b.lines} short lines. The script MUST finish within the selected duration. Never pad output. A 30-second script must be short and must not become multiple pages. Every line must be something a person actually says. Use narration when there is no dialogue. Natural spoken language only.`;let r=await ask(system,`Write the spoken script for this brief:\n${brief()}\nUse compact timestamps such as 00:00-00:05. Return nothing except the script.`,b.tokens);show(cleanScript(r));save(brief(),last)}catch(e){show('# '+T().error+'\n\n'+e.message)}finally{$('generate').disabled=false;$('status').textContent=T().ready}}
function show(v){last=String(v||'');$('loading').classList.add('hidden');$('empty').classList.add('hidden');$('output').classList.remove('hidden');$('output').innerHTML=md(last);$('copy').classList.remove('hidden');$('export').classList.remove('hidden');$('meta').textContent=new Date().toLocaleString()}function save(b,m){let h=JSON.parse(localStorage.getItem('scriptforge-history')||'[]');h.unshift({topic:b.split('\n')[0],date:new Date().toISOString(),md:m});localStorage.setItem('scriptforge-history',JSON.stringify(h.slice(0,20)))}
const prompts={hooks:t=>`Generate 6 short hooks for "${t.slice(0,800)}". Output only the hooks.`,titles:t=>`Generate 8 concise honest titles for "${t.slice(0,800)}".`,retention:t=>`Give a compact retention diagnosis for "${t.slice(0,800)}".`,shots:t=>`Give a compact shot list for "${t.slice(0,800)}".`,repurpose:t=>`Give 4 concise repurposing ideas for "${t.slice(0,800)}".`,comments:t=>`Give 4 useful comment prompts for "${t.slice(0,800)}".`,package:t=>`Give a concise publishing package for "${t.slice(0,800)}".`};async function runTool(){let q=$('toolTopic').value.trim()||$('topic').value.trim();if(!q)return alert(T().noTopic);$('toolOutput').innerHTML='<p class="text-slate-400">'+T().working+'</p>';try{$('toolOutput').innerHTML=md(await ask('Return concise Markdown only. No filler.',prompts[tool](q),AI_CONFIG.toolMaxTokens))}catch(e){$('toolOutput').innerHTML='<p class="text-red-600">'+esc(e.message)+'</p>'}}
function openModal(t,d,b){$('modalTitle').textContent=t;$('modalDesc').textContent=d;$('modalBody').innerHTML=b;$('modal').classList.remove('hidden');$('modal').classList.add('flex')}function closeModal(){$('modal').classList.add('hidden');$('modal').classList.remove('flex')}async function inspire(){openModal(T().ideasTitle,T().ideasDesc,'<div id="ideas"><p class="text-slate-400">'+T().working+'</p></div>');try{let raw=await ask('Return ONLY valid JSON. Exactly 6 objects with only title and angle. No markdown.',`Create exactly 6 short video topic ideas about ${$('topic').value.trim().slice(0,800)||'content creation'}. Language: ${lang==='en'?'English':'Simplified Chinese'}.`,AI_CONFIG.inspirationMaxTokens);let a=JSON.parse(raw.match(/\[[\s\S]*\]/)?.[0]||raw);$('ideas').innerHTML=a.slice(0,6).map((x,i)=>`<button class="text-left border rounded-xl p-4" data-idea="${esc(x.title||'')}"><b>${i+1}. ${esc(x.title||'')}</b><p class="text-sm text-slate-600 mt-1">${esc(x.angle||'')}</p></button>`).join('');document.querySelectorAll('[data-idea]').forEach(b=>b.onclick=()=>{$('topic').value=b.dataset.idea;closeModal();$('topic').focus()})}catch(e){$('ideas').innerHTML='<p class="text-red-600">'+esc(e.message)+'</p>'}}
function exportMenu(){openModal(T().export,T().export,'<div class="grid sm:grid-cols-2 gap-3"><button data-e="md" class="border rounded-xl p-4 text-left"><b>Markdown</b></button><button data-e="txt" class="border rounded-xl p-4 text-left"><b>Plain text</b></button><button data-e="html" class="border rounded-xl p-4 text-left"><b>HTML</b></button><button data-e="pdf" class="border rounded-xl p-4 text-left"><b>Print / PDF</b></button></div>');document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>doExport(b.dataset.e))}function doExport(t){if(!last)return;if(t==='pdf'){let w=window.open('','_blank');w.document.write('<html><head><title>ScriptForge</title><style>@page{margin:14mm}body{font-family:Arial,sans-serif;font-size:11pt;line-height:1.45}h1{font-size:18pt;margin:0 0 10pt}p{margin:4pt 0}</style></head><body>'+md(last)+'</body></html>');w.document.close();setTimeout(()=>w.print(),150);return}let data=t==='html'?'<!doctype html><html><body>'+md(last)+'</body></html>':t==='txt'?last.replace(/[#*_`]/g,''):last;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:t==='html'?'text/html':'text/plain'}));a.download='scriptforge-script.'+t;a.click();URL.revokeObjectURL(a.href);closeModal()}
$('generate').onclick=generate;$('run').onclick=runTool;$('inspire').onclick=inspire;$('export').onclick=exportMenu;$('close').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(last);$('meta').textContent=T().copied}catch(e){alert(last)}};$('clear').onclick=()=>{last='';$('output').innerHTML='';$('output').classList.add('hidden');$('loading').classList.add('hidden');$('empty').classList.remove('hidden');$('copy').classList.add('hidden');$('export').classList.add('hidden');$('meta').textContent=T().ready};$('history').onclick=()=>{let h=JSON.parse(localStorage.getItem('scriptforge-history')||'[]');if(!h.length)return alert(T().noHistory);let n=prompt(h.map((x,i)=>`${i+1}. ${x.topic} · ${new Date(x.date).toLocaleString()}`).join('\n')+'\n\nEnter number:');let x=h[Number(n)-1];if(x)show(x.md)};$('language').onclick=()=>{lang=lang==='en'?'zh':'en';setup()};setup();
</script></body></html>
