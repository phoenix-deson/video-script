<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScriptForge</title><script src="https://cdn.tailwindcss.com"></script><style>body{margin:0;background:#f6f7fb;color:#0f172a;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.glass{background:rgba(255,255,255,.94);backdrop-filter:blur(14px)}.hero{background:radial-gradient(circle at 10% 10%,#e0e7ff,transparent 35%),radial-gradient(circle at 90% 20%,#fce7f3,transparent 35%),#fff}.grad{background:linear-gradient(90deg,#4f46e5,#7c3aed,#db2777);-webkit-background-clip:text;background-clip:text;color:transparent}.card{background:#fff;border:1px solid #e2e8f0;border-radius:20px}.active{background:#111827!important;color:#fff!important}.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.md{line-height:1.75}.md h1,.md h2,.md h3{font-weight:800;margin:1.2em 0 .5em}.md ul{padding-left:1.5em}.md li{margin:.3em 0}.idea{cursor:pointer;transition:.15s}.idea:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(15,23,42,.08)}</style></head><body><header class="sticky top-0 z-40 border-b border-slate-200 glass"><div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-600 to-violet-600 text-white grid place-items-center text-xl">✦</div><div><b>ScriptForge</b><div id="tag" class="text-xs text-slate-500"></div></div></div><div class="flex gap-2"><button id="history" class="px-3 py-2 rounded-lg text-sm"></button><button id="language" class="px-3 py-2 rounded-lg border bg-white text-sm"></button></div></div></header><main class="max-w-7xl mx-auto px-4 py-7"><section class="hero border rounded-3xl p-7 sm:p-10 mb-6"><span id="badge" class="text-xs font-bold text-indigo-700 bg-indigo-50 px-3 py-1 rounded-full"></span><h1 class="text-4xl sm:text-6xl font-black mt-4"><span id="hero1"></span> <span id="hero2" class="grad"></span></h1><p id="heroDesc" class="mt-4 max-w-3xl text-lg text-slate-600"></p></section><div class="grid lg:grid-cols-12 gap-6"><section class="lg:col-span-5 space-y-5"><div class="card p-5 shadow-sm"><div class="flex justify-between items-center mb-4"><h2 id="brief" class="font-black"></h2><button id="inspire" class="text-xs font-bold text-indigo-600"></button></div><label id="topicLabel" class="text-xs font-bold"></label><textarea id="topic" rows="4" class="mt-2 w-full border rounded-xl p-3" placeholder=""></textarea><div class="grid grid-cols-2 gap-3 mt-4"><div><label id="formatLabel" class="text-xs font-bold"></label><select id="format" class="mt-1 w-full border rounded-xl p-3"></select></div><div><label id="platformLabel" class="text-xs font-bold"></label><select id="platform" class="mt-1 w-full border rounded-xl p-3"></select></div><div><label id="durationLabel" class="text-xs font-bold"></label><select id="duration" class="mt-1 w-full border rounded-xl p-3"></select></div><div><label id="audienceLabel" class="text-xs font-bold"></label><select id="audience" class="mt-1 w-full border rounded-xl p-3"></select></div></div><label id="toneLabel" class="block mt-4 text-xs font-bold"></label><div id="tones" class="grid grid-cols-3 gap-2 mt-2"></div><div class="grid grid-cols-2 gap-3 mt-4"><div><label id="goalLabel" class="text-xs font-bold"></label><select id="goal" class="mt-1 w-full border rounded-xl p-3"></select></div><div><label id="intensityLabel" class="text-xs font-bold"></label><select id="intensity" class="mt-1 w-full border rounded-xl p-3"></select></div></div><label class="flex gap-2 mt-4 text-sm"><input id="captions" type="checkbox" checked><span id="captionsLabel"></span></label><label class="flex gap-2 mt-2 text-sm"><input id="broll" type="checkbox" checked><span id="brollLabel"></span></label><button id="generate" class="mt-5 w-full py-3.5 rounded-xl bg-slate-950 text-white font-black"></button></div><div class="card p-5"><div class="flex justify-between"><b id="connection"></b><span id="status" class="text-xs text-emerald-600"></span></div><p id="connectionDesc" class="text-xs text-slate-500 mt-2"></p></div></section><section class="lg:col-span-7"><div class="card shadow-sm min-h-[720px]"><div class="p-4 border-b flex justify-between items-center gap-3"><div><b id="result"></b><div id="meta" class="text-[11px] text-slate-400 mt-1"></div></div><div class="flex gap-2"><button id="copy" class="hidden px-3 py-2 text-xs rounded-lg bg-slate-100"></button><button id="export" class="hidden px-3 py-2 text-xs rounded-lg bg-slate-100"></button><button id="clear" class="px-3 py-2 text-xs rounded-lg"></button></div></div><div class="p-5 sm:p-7"><div id="empty" class="min-h-[590px] grid place-items-center text-center"><div><div class="text-6xl">🎬</div><h3 id="emptyTitle" class="font-black text-xl mt-4"></h3><p id="emptyDesc" class="text-slate-500 mt-2 max-w-md"></p></div></div><div id="loading" class="hidden min-h-[590px] grid place-items-center text-center"><div><div class="w-12 h-12 border-4 border-indigo-100 border-t-indigo-600 rounded-full spin mx-auto"></div><b id="loadingTitle" class="block mt-4"></b><p id="loadingDesc" class="text-xs text-slate-400"></p></div></div><article id="output" class="hidden md"></article></div></div></section></div><section class="card p-5 mt-6"><div class="flex flex-wrap gap-2 items-center"><b id="lab" class="mr-2"></b><div id="tools" class="flex flex-wrap gap-2"></div></div><div class="flex gap-2 mt-4"><input id="toolTopic" class="flex-1 border rounded-xl p-3"><button id="run" class="px-5 rounded-xl bg-indigo-600 text-white font-bold"></button></div><div id="toolOutput" class="md mt-5"></div></section></main><footer id="footer" class="max-w-7xl mx-auto px-4 pb-8 text-xs text-slate-400"></footer><div id="modal" class="hidden fixed inset-0 z-50 bg-slate-950/50 p-4 items-center justify-center"><div class="bg-white rounded-2xl max-w-2xl w-full max-h-[88vh] overflow-auto p-6"><div class="flex justify-between items-center"><div><h2 id="modalTitle" class="font-black text-xl"></h2><p id="modalDesc" class="text-sm text-slate-500 mt-1"></p></div><button id="close">✕</button></div><div id="modalBody" class="mt-5"></div></div></div><script>
const AI_CONFIG={base:'https://api.deepseek.com',key:'',model:'deepseek-v4-flash'};
const I={en:{tag:'AI Video Script Studio',badge:'Built for creators',hero1:'Turn an idea into a',hero2:'production-ready script',heroDesc:'Professional hooks, titles, scenes, voiceover, visual direction, retention strategy and publishing assets in one workflow.',brief:'Creative brief',inspire:'✦ Inspire me',topic:'Topic or idea',ph:'e.g. Why most people waste the first hour of their day',format:'Format',platform:'Platform',duration:'Duration',audience:'Audience',tone:'Tone',goal:'Primary goal',intensity:'Hook intensity',captions:'Write caption-friendly lines',broll:'Add B-roll suggestions',generate:'Generate professional script →',connection:'AI connection',connectionDesc:'Add your own key directly to AI_CONFIG.key in this file. No settings screen is used.',ready:'Ready',working:'Generating…',result:'Your script',copy:'Copy',copied:'Copied ✓',export:'Export',clear:'Clear',emptyTitle:'Your next video starts here',emptyDesc:'Enter a topic and generate a complete production-ready package.',loading:'Crafting your script…',loadingDesc:'Building hooks, retention beats, scenes and creator assets',lab:'Creator Lab',run:'Run AI tool',toolph:'Use the current topic or enter another topic',history:'History',lang:'中文',error:'Error',noTopic:'Please enter a topic first.',noKey:'Add your own key to AI_CONFIG.key in index.html first.',noHistory:'No saved scripts yet.',ideasTitle:'AI Inspiration',ideasDesc:'Pick a topic to use it immediately.',footer:'ScriptForge · AI creator studio',tones:['High-energy','Smart & clear','Emotional','Cinematic','Funny','Bold & provocative'],tools:{hooks:'Hook Lab',titles:'Title Lab',retention:'Retention Doctor',shots:'Shot Planner',repurpose:'Repurpose Engine',comments:'Comment Bait',package:'Creator Package'}},zh:{tag:'AI 视频脚本工作室',badge:'为创作者打造',hero1:'把一个想法变成',hero2:'可以直接制作的专业脚本',heroDesc:'一次完成钩子、标题、分镜、口播、视觉指导、留存策略和发布素材。',brief:'创作需求',inspire:'✦ AI 灵感',topic:'主题或想法',ph:'例如：为什么大多数人浪费了每天的第一个小时',format:'内容形式',platform:'发布平台',duration:'视频时长',audience:'目标受众',tone:'内容风格',goal:'主要目标',intensity:'钩子强度',captions:'生成适合字幕的台词',broll:'加入 B-roll 建议',generate:'生成专业脚本 →',connection:'AI 连接',connectionDesc:'直接在本页面源码的 AI_CONFIG.key 中填写自己的密钥，不提供额外配置页面。',ready:'准备好了',working:'正在生成……',result:'你的脚本',copy:'复制',copied:'已复制 ✓',export:'导出',clear:'清空',emptyTitle:'你的下一个视频从这里开始',emptyDesc:'输入主题，生成完整的专业视频制作方案。',loading:'正在创作脚本……',loadingDesc:'正在设计钩子、留存节点、分镜和创作者素材',lab:'创作者工具箱',run:'运行 AI 工具',toolph:'使用当前主题或输入新的主题',history:'历史记录',lang:'English',error:'错误',noTopic:'请先输入视频主题。',noKey:'请先在 index.html 的 AI_CONFIG.key 中填入你自己的密钥。',noHistory:'暂无保存的脚本。',ideasTitle:'AI 灵感',ideasDesc:'点击一个主题，立即填入创作框。',footer:'ScriptForge · AI 创作者工作室',tones:['高能量','聪明清晰','情绪化','电影感','幽默','大胆犀利'],tools:{hooks:'钩子实验室',titles:'标题实验室',retention:'留存诊断',shots:'分镜规划',repurpose:'内容再利用',comments:'评论引导',package:'创作者发布包'}}};
const O={format:['Solo narration','Talking head','Storytelling','Mini documentary','Educational explainer','Product / UGC','Interview','Short-form drama'],platform:['YouTube','YouTube Shorts','TikTok','Instagram Reels','Podcast','LinkedIn','Bilibili','Custom'],duration:['30 seconds','60 seconds','90 seconds','3 minutes','5 minutes','8 minutes','10 minutes','15 minutes','20 minutes'],audience:['General audience','Beginners','Professionals','Gen Z','Business owners','Creators'],goal:['Views & retention','Followers','Comments & discussion','Leads / sales','Education','Personal brand'],intensity:['Extreme','Strong','Balanced','Soft']};
const OZ={format:['单人口播','出镜讲解','故事讲述','迷你纪录片','知识讲解','产品 / 用户内容','访谈','短剧'],platform:['YouTube','YouTube Shorts','TikTok','Instagram Reels','播客','LinkedIn','哔哩哔哩','自定义'],duration:['30 秒','60 秒','90 秒','3 分钟','5 分钟','8 分钟','10 分钟','15 分钟','20 分钟'],audience:['大众观众','初学者','专业人士','Z 世代','企业主','内容创作者'],goal:['播放量与留存','涨粉','评论与讨论','获客与销售','知识教育','个人品牌'],intensity:['极强','强','平衡','柔和']};
let lang='zh',tone='High-energy',last='',tool='hooks';const $=x=>document.getElementById(x),T=()=>I[lang];
function setup(){const t=T();[['tag','tag'],['badge','badge'],['hero1','hero1'],['hero2','hero2'],['heroDesc','heroDesc'],['brief','brief'],['inspire','inspire'],['topicLabel','topic'],['formatLabel','format'],['platformLabel','platform'],['durationLabel','duration'],['audienceLabel','audience'],['toneLabel','tone'],['goalLabel','goal'],['intensityLabel','intensity'],['captionsLabel','captions'],['brollLabel','broll'],['generate','generate'],['connection','connection'],['connectionDesc','connectionDesc'],['result','result'],['copy','copy'],['export','export'],['clear','clear'],['emptyTitle','emptyTitle'],['emptyDesc','emptyDesc'],['loadingTitle','loading'],['loadingDesc','loadingDesc'],['lab','lab'],['run','run'],['footer','footer']].forEach(([id,k])=>$(id).textContent=t[k]);$('topic').placeholder=t.ph;$('toolTopic').placeholder=t.toolph;$('history').textContent=t.history;$('language').textContent=t.lang;$('status').textContent=t.ready;Object.keys(O).forEach(k=>{$(k).innerHTML=O[k].map((x,i)=>`<option value="${esc(x)}">${lang==='zh'?OZ[k][i]:x}</option>`).join('')});renderTones();renderTools();document.documentElement.lang=lang}
function renderTones(){const old=tone;$('tones').innerHTML=T().tones.map((x,i)=>`<button type="button" class="tone border rounded-xl p-2 text-xs font-bold ${I.en.tones[i]===old?'active':''}" data-value="${I.en.tones[i]}">${x}</button>`).join('');document.querySelectorAll('.tone').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tone').forEach(x=>x.classList.remove('active'));b.classList.add('active');tone=b.dataset.value})}
function renderTools(){$('tools').innerHTML=Object.entries(T().tools).map(([k,v])=>`<button type="button" class="tool border rounded-lg px-3 py-2 text-xs font-bold ${k===tool?'active':''}" data-tool="${k}">${v}</button>`).join('');document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));b.classList.add('active');tool=b.dataset.tool})}
function contentText(v){if(typeof v==='string')return v;if(Array.isArray(v))return v.map(x=>typeof x==='string'?x:(x?.text||x?.content||'')).join('');if(v&&typeof v==='object')return v.text||v.content||v.value||'';return ''}
async function ask(system,user,max=7000){if(!AI_CONFIG.key.trim())throw Error(T().noKey);let r;try{r=await fetch(AI_CONFIG.base+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+AI_CONFIG.key.trim()},body:JSON.stringify({model:AI_CONFIG.model,messages:[{role:'system',content:system},{role:'user',content:user}],temperature:.75,max_tokens:max,stream:false})})}catch(e){throw Error(lang==='zh'?'网络请求失败，请检查网络连接。':'Network request failed. Check your connection.')}const text=await r.text();let data;try{data=JSON.parse(text)}catch(e){throw Error((lang==='zh'?'AI 返回了无法解析的数据：':'AI returned invalid data: ')+text.slice(0,300))}if(!r.ok)throw Error(data.error?.message||('HTTP '+r.status));const choice=data.choices?.[0]||{};const msg=choice.message||{};const candidates=[msg.content,msg.reasoning_content,choice.text,data.output_text,data.output?.text,data.output?.content];let out='';for(const c of candidates){out=contentText(c);if(out.trim())break}if(!out.trim()){const keys=Object.keys(msg);throw Error(lang==='zh'?`AI 请求成功，但没有可显示的文本。返回字段：${keys.join(', ')||'无'}。请检查模型名称或响应格式。`:`AI request succeeded but returned no displayable text. Message fields: ${keys.join(', ')||'none'}.`)}return out.trim()}
function brief(){return ['Topic: '+$('topic').value.trim(),'Format: '+$('format').value,'Platform: '+$('platform').value,'Duration: '+$('duration').value,'Audience: '+$('audience').value,'Tone: '+tone,'Goal: '+$('goal').value,'Hook intensity: '+$('intensity').value,'Caption friendly: '+$('captions').checked,'B-roll: '+$('broll').checked].join('\n')}
function md(text){let s=esc(text).replace(/\r/g,'');s=s.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/^[-*] (.*)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>\n?)+/g,m=>'<ul>'+m+'</ul>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\n\n+/g,'</p><p>').replace(/\n/g,'<br>');return '<p>'+s+'</p>'}
function showResult(text){last=String(text||'').trim();if(!last)throw Error(lang==='zh'?'AI 返回内容为空。':'AI returned an empty script.');$('output').innerHTML=md(last);$('output').classList.remove('hidden');$('empty').classList.add('hidden');$('loading').classList.add('hidden');$('copy').classList.remove('hidden');$('export').classList.remove('hidden');$('meta').textContent=new Date().toLocaleString()}
async function generate(){if(!$('topic').value.trim()){alert(T().noTopic);return}$('generate').disabled=true;$('generate').textContent=T().working;$('empty').classList.add('hidden');$('output').classList.add('hidden');$('loading').classList.remove('hidden');$('status').textContent=T().working;try{const language=lang==='zh'?'Simplified Chinese':'English';const system=`You are an elite video scriptwriter, director, editor and retention strategist. Write in ${language} only. Return plain Markdown text. Do not return JSON or code fences. Never fabricate facts.`;const user=`Create a complete production-ready ${$('duration').value} video package.\n${brief()}\n\nRequired: 3 radically different hooks and choose the strongest; 10 titles; promise and open loop; full scene-by-scene script with timestamps, voiceover, on-screen text, visual direction, B-roll, framing, camera movement, edit and audio notes; pattern interrupts; retention map; likely drop-off points and fixes; payoff; CTA; 3 thumbnail concepts; description; SEO keywords; hashtags; pinned comment; upload checklist; 3 short-form cutdowns.`;showResult(await ask(system,user,7000));save(last)}catch(e){$('loading').classList.add('hidden');$('output').classList.remove('hidden');$('output').innerHTML=`<div class="border-l-4 border-amber-500 bg-amber-50 p-4 rounded-lg"><b>${T().error}</b><p>${esc(e.message)}</p></div>`;$('status').textContent=T().error}finally{$('generate').disabled=false;$('generate').textContent=T().generate}}
function save(mdText){try{const h=JSON.parse(localStorage.getItem('sf-history')||'[]');h.unshift({topic:$('topic').value.trim(),date:new Date().toISOString(),md:mdText});localStorage.setItem('sf-history',JSON.stringify(h.slice(0,20)))}catch(e){}}
const P={hooks:t=>`Generate 8 strong hooks for "${t}". Keep them short and usable.`,titles:t=>`Generate 10 clickable but honest titles for "${t}".`,retention:t=>`Give a concise retention audit for "${t}": weak points, open loops, pattern interrupts and fixes.`,shots:t=>`Create a concise shot plan for "${t}" with framing, action, B-roll and edit notes.`,repurpose:t=>`Give 5 practical short-form repurposing ideas for "${t}".`,comments:t=>`Create 8 thoughtful discussion prompts for "${t}" without spammy engagement bait.`,package:t=>`Create a concise publishing package for "${t}": titles, thumbnail ideas, description, keywords and hashtags.`};
async function runTool(){const t=$('toolTopic').value.trim()||$('topic').value.trim();if(!t){alert(T().noTopic);return}$('toolOutput').innerHTML='<p class="text-slate-400">'+T().working+'</p>';try{$('toolOutput').innerHTML=md(await ask(`You are a senior creator strategist. Write in ${lang==='zh'?'Simplified Chinese':'English'} only. Return plain Markdown.`,P[tool](t),3000))}catch(e){$('toolOutput').innerHTML='<div class="text-red-600">'+esc(e.message)+'</div>'}}
async function inspire(){const topic=$('topic').value.trim()||'content creation';$('modalTitle').textContent=T().ideasTitle;$('modalDesc').textContent=T().ideasDesc;$('modalBody').innerHTML='<p class="text-slate-400">'+T().working+'</p>';$('modal').classList.remove('hidden');$('modal').classList.add('flex');try{const raw=await ask(`You are a YouTube content strategist. Write in ${lang==='zh'?'Simplified Chinese':'English'} only. Return exactly 6 lines. Each line must be a concise video topic/title, no numbering, no explanation.`,`Give me exactly 6 interesting video topics based on: ${topic}. They should be specific, clickable and useful.`,1200);const ideas=raw.split(/\n+/).map(x=>x.replace(/^\s*[-*•\d.)]+\s*/,'').trim()).filter(Boolean).slice(0,6);$('modalBody').innerHTML=ideas.map(x=>`<button type="button" class="idea w-full text-left border rounded-xl p-4 mb-3 bg-white" data-idea="${esc(x)}"><b>${esc(x)}</b><span class="block text-xs text-slate-400 mt-1">${lang==='zh'?'点击立即使用':'Click to use'}</span></button>`).join('');document.querySelectorAll('.idea').forEach(b=>b.onclick=()=>{$('topic').value=b.dataset.idea;closeModal()})}catch(e){$('modalBody').innerHTML='<p class="text-red-600">'+esc(e.message)+'</p>'}}
function closeModal(){$('modal').classList.add('hidden');$('modal').classList.remove('flex')}
function history(){const h=JSON.parse(localStorage.getItem('sf-history')||'[]');if(!h.length){alert(T().noHistory);return}const n=Number(prompt(h.map((x,i)=>`${i+1}. ${x.topic} · ${new Date(x.date).toLocaleString()}`).join('\n')+'\n\n'+(lang==='zh'?'输入编号：':'Enter number:')))-1;if(h[n])showResult(h[n].md)}
function exportMenu(){const c=prompt(lang==='zh'?'输入导出格式：md / txt / html / pdf':'Enter export format: md / txt / html / pdf','md');if(!c||!last)return;if(c==='pdf'){const w=window.open('','_blank');if(!w)return;w.document.write('<html><head><meta charset="utf-8"><style>body{font-family:Arial;max-width:900px;margin:40px auto;line-height:1.7}</style></head><body>'+md(last)+'</body></html>');w.document.close();setTimeout(()=>w.print(),300);return}const data=c==='txt'?last.replace(/[#*_`]/g,''):c==='html'?'<!doctype html><html><body>'+md(last)+'</body></html>':last;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:c==='html'?'text/html':'text/plain'}));a.download='scriptforge-script.'+c;a.click()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('generate').onclick=generate;$('run').onclick=runTool;$('history').onclick=history;$('inspire').onclick=inspire;$('export').onclick=exportMenu;$('close').onclick=closeModal;$('language').onclick=()=>{lang=lang==='en'?'zh':'en';setup()};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(last);$('copy').textContent=T().copied;setTimeout(()=>$('copy').textContent=T().copy,1200)}catch(e){alert(last)}};$('clear').onclick=()=>{last='';$('output').innerHTML='';$('output').classList.add('hidden');$('empty').classList.remove('hidden');$('copy').classList.add('hidden');$('export').classList.add('hidden');$('meta').textContent=T().ready};setup();
</script></body></html>
