<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScriptForge — AI Video Script Studio</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><style>body{margin:0;background:#f6f7fb;color:#0f172a;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.glass{background:rgba(255,255,255,.92);backdrop-filter:blur(14px)}.hero{background:radial-gradient(circle at 15% 20%,#e0e7ff,transparent 34%),radial-gradient(circle at 85% 25%,#fce7f3,transparent 32%),#fff}.grad{background:linear-gradient(90deg,#4f46e5,#7c3aed,#db2777);-webkit-background-clip:text;color:transparent}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px}.tone.active,.tool.active{background:#0f172a;color:#fff;border-color:#0f172a}.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.md h1,.md h2,.md h3{font-weight:800;margin:1.3em 0 .6em}.md table{width:100%;border-collapse:collapse;margin:1em 0;font-size:13px}.md th,.md td{border:1px solid #e2e8f0;padding:9px;vertical-align:top}.md th{background:#f8fafc}.md blockquote{border-left:4px solid #6366f1;padding-left:12px;color:#475569}</style></head><body><header class="sticky top-0 z-40 border-b border-slate-200 glass"><div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-600 to-violet-600 text-white grid place-items-center text-xl">✦</div><div><b>ScriptForge</b><div id="tagline" class="text-[11px] text-slate-500"></div></div></div><div class="flex gap-2"><button id="historyBtn" class="px-3 py-2 text-sm rounded-lg hover:bg-slate-100"></button><button id="langBtn" class="px-3 py-2 text-sm rounded-lg border bg-white"></button></div></div></header><main class="max-w-7xl mx-auto px-4 py-7"><section class="hero rounded t-bold rounded-lg bg-slate-100"></button><button id="exportBtn" class="hidden px-3 py-2 text-xs font-bold rounded-lg bg-slate-100"></button><button id="clear" class="px-3 py-2 text-xs font-bold rounded-lg hover:bg-slate-100"></button></div></div><div class="p-5 sm:p-7 md"><div id="empty" class="min-h-[590px] grid place-items-center text-center"><div><div class="text-6xl">🎬</div><h3 id="emptyTitle" class="font-black text-xl mt-4"></h3><p id="emptyDesc" class="text-slate-500 mt-2 max-w-md"></p></div></div><div id="loading" class="hidden min-h-[590px] grid place-items-center text-center"><div><div class="w-12 h-12 border-4 border-indigo-100 border-t-indigo-600 rounded-full spin mx-auto"></div><b id="loadingTitle" class="block mt-4"></b><small id="loadingDesc" class="text-slate-400"></small></div></div><article id="output" class="hidden md"></article></div></div></section></div><section class="card p-5 mt-6"><div class="flex flex-wrap gap-2 items-center"><b id="labTitle" class="mr-2"></b><div id="toolTabs" class="flex flex-wrap gap-2"></div></div><div class="flex gap-2 mt-4"><input id="toolTopic" class="flex-1 border rounded-xl p-3"><button id="runTool" class="px-5 rounded-xl bg-indigo-600 text-white font-bold"></button></div><div id="toolOutput" class="mt-5 md"></div></section></main><footer class="max-w-7xl mx-auto px-4 pb-8 text-xs text-slate-400">ScriptForge · AI powered creator studio</footer><div id="modal" class="hidden fixed inset-0 z-50 bg-slate-950/50 p-4 items-center justify-center"><div class="bg-white rounded-2xl max-w-3xl w-full max-h-[88vh] overflow-auto p-6"><div class="flex justify-between"><div><h2 id="modalTitle" class="font-black text-xl"></h2><p id="modalDesc" class="text-sm text-slate-500 mt-1"></p></div><button id="closeModal">✕</button></div><div id="modalBody" class="mt-5"></div></div></div><script>
const AI_CONFIG={base:'https://api.deepseek.com',key:'sk-6aea8f16cc0b401b83078a98d63f96c6',model:'deepseek-v4-flash'};
const T={en:{tagline:'AI Video Script Studio',badge:'Built for creators',heroA:'Turn an idea into a',heroB:'production-ready script',heroDesc:'Professional hooks, titles, scenes, voiceover, visual direction, retention strategy and publishing assets in one workflow.',brief:'Creative brief',inspire:'✦ Inspire me',topic:'Topic or idea',topicPH:'e.g. Why most people waste the first hour of their day',format:'Format',platform:'Platform',duration:'Duration',audience:'Audience',tone:'Tone',goal:'Primary goal',intensity:'Hook intensity',captions:'Write caption-friendly lines',broll:'Add B-roll suggestions',generate:'Generate professional script →',connection:'AI connection',connectionDesc:'Private browser build. No configuration screen is required.',ready:'Ready',result:'Your script',copy:'Copy',export:'Export',clear:'Clear',emptyTitle:'Your next video starts here',emptyDesc:'Enter a topic and generate a complete production-ready package.',loading:'Crafting your script…',loadingDesc:'Building hooks, retention beats, scenes and creator assets',lab:'Creator Lab',run:'Run AI tool',toolPH:'Use the current topic or enter another topic',history:'History',lang:'中文',tones:['High-energy','Smart & clear','Emotional','Cinematic','Funny','Bold & provocative'],tools:{hooks:'Hook Lab',titles:'Title Lab',retention:'Retention Doctor',shots:'Shot Planner',repurpose:'Repurpose Engine',comments:'Comment Bait',package:'Creator Package'},error:'Error',copied:'Copied',noHistory:'No saved script yet.',exportTitle:'Export script',exportDesc:'Choose a format.',md:'Markdown',txt:'Plain text',html:'HTML',pdf:'Print / PDF'},zh:{tagline:'AI 视频脚本工作室',badge:'为创作者打造',heroA:'把一个想法变成',heroB:'可以直接制作的专业脚本',heroDesc:'一次完成钩子、标题、分镜、口播、视觉指导、留存策略和发布素材。',brief:'创作需求',inspire:'✦ AI 灵感',topic:'主题或想法',topicPH:'例如：为什么大多数人浪费了每天的第一个小时',format:'内容形式',platform:'发布平台',duration:'视频时长',audience:'目标受众',tone:'内容风格',goal:'主要目标',intensity:'钩子强度',captions:'生成适合字幕的台词',broll:'加入 B-roll 建议',generate:'生成专业脚本 →',connection:'AI 连接',connectionDesc:'浏览器专用版本，不需要额外配置页面。',ready:'准备好了',result:'你的脚本',copy:'复制',export:'导出',clear:'清空',emptyTitle:'你的下一个视频从这里开始',emptyDesc:'输入主题，生成完整的专业视频制作方案。',loading:'正在创作脚本……',loadingDesc:'正在设计钩子、留存节点、分镜和创作者素材',lab:'创作者工具箱',run:'运行 AI 工具',toolPH:'使用当前主题或输入新的主题',history:'历史记录',lang:'English',tones:['高能量','聪明清晰','情绪化','电影感','幽默','大胆犀利'],tools:{hooks:'钩子实验室',titles:'标题实验室',retention:'留存诊断',shots:'分镜规划',repurpose:'内容再利用',comments:'评论引导',package:'创作者发布包'},error:'错误',copied:'已复制',noHistory:'暂无保存的脚本。',exportTitle:'导出脚本',exportDesc:'选择导出格式。',md:'Markdown',txt:'纯文本',html:'HTML',pdf:'打印 / PDF'}};
let lang='en',tone='High-energy',last='',activeTool='hooks';const $=id=>document.getElementById(id),L=()=>T[lang];
function setup(){const l=L();const map={tagline:'tagline',badge:'badge',heroA:'heroA',heroB:'heroB',heroDesc:'heroDesc',brief:'brief',inspire:'inspireBtn',topic:'topicLabel',format:'formatLabel',platform:'platformLabel',duration:'durationLabel',audience:'audienceLabel',tone:'toneLabel',goal:'goalLabel',intensity:'intensityLabel',captions:'captionsLabel',broll:'brollLabel',generate:'generate',connection:'connectionTitle',connectionDesc:'connectionDesc',result:'resultTitle',copy:'copy',export:'exportBtn',clear:'clear',emptyTitle:'emptyTitle',emptyDesc:'emptyDesc',loading:'loadingTitle',loadingDesc:'loadingDesc',lab:'labTitle',run:'runTool'};Object.keys(map).forEach(k=>{if($(map[k]))$(map[k]).textContent=l[k]||''});$('topic').placeholder=l.topicPH;$('toolTopic').placeholder=l.toolPH;$('historyBtn').textContent=l.history;$('langBtn').textContent=l.lang;$('status').textContent=l.ready;renderTones();renderTools()}
function renderTones(){const n=L().tones;$('tones').innerHTML=n.map((x,i)=>`<button type="button" class="tone ${i===0?'active':''} border rounded-xl p-2 text-xs font-bold" data-tone="${T.en.tones[i]}">${x}</button>`).join('');document.querySelectorAll('.tone').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tone').forEach(x=>x.classList.remove('active'));b.classList.add('active');tone=b.dataset.tone})}
function renderTools(){const t=L().tools;$('toolTabs').innerHTML=Object.entries(t).map(([k,v],i)=>`<button type="button" class="tool ${i===0?'active':''} border rounded-lg px-3 py-2 text-xs font-bold" data-tool="${k}">${v}</button>`).join('');document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeTool=b.dataset.tool})}
async function ask(system,user,max=8000){if(!AI_CONFIG.key.trim())throw new Error(lang==='en'?'Add your own key to AI_CONFIG.key in index.html first.':'请先在 index.html 的 AI_CONFIG.key 中填入你自己的密钥。');const r=await fetch(AI_CONFIG.base+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+AI_CONFIG.key},body:JSON.stringify({model:AI_CONFIG.model,messages:[{role:'system',content:system},{role:'user',content:user}],temperature:.82,max_tokens:max})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error?.message||'HTTP '+r.status);return d.choices?.[0]?.message?.content||''}
function getBrief(){return `Topic: ${$('topic').value.trim()}\nFormat: ${$('format').value}\nPlatform: ${$('platform').value}\nDuration: ${$('duration').value}\nAudience: ${$('audience').value}\nTone: ${tone}\nGoal: ${$('goal').value}\nHook intensity: ${$('intensity').value}\nCaptions: ${$('captions').checked}\nB-roll: ${$('broll').checked}\nLanguage: ${lang==='en'?'English':'Simplified Chinese'}`}
async function generate(){if(!$('topic').value.trim()){alert(lang==='en'?'Please enter a topic first.':'请先输入主题。');return}$('generate').disabled=true;$('empty').classList.add('hidden');$('output').classList.add('hidden');$('loading').classList.remove('hidden');$('status').textContent='Working';try{last=await ask('You are an elite video writer, director, editor and retention strategist. Return clean Markdown. Never fabricate factual claims. Optimize for the selected platform and audience.','Create a complete '+$('duration').value+' video package from this brief:\n'+getBrief()+`\n\nRequired: 3 distinct opening hooks and strongest-hook choice; 10 titles; promise and open loop; full scene-by-scene table with timestamps, voiceover, on-screen text, framing, camera movement, visual/B-roll and edit/audio notes; pattern interrupts; retention map and likely drop-off fixes; payoff; CTA; 3 thumbnail concepts; platform description; SEO keywords; hashtags; pinned comment; upload checklist; 3 short-form cutdowns.`,8000);render(last);saveHistory(getBrief(),last)}catch(e){last='**'+L().error+'**\n\n'+e.message;render(last)}finally{$('generate').disabled=false;$('status').textContent=L().ready}}
function render(md){$('loading').classList.add('hidden');$('output').classList.remove('hidden');$('output').innerHTML=marked.parse(md);$('copy').classList.remove('hidden');$('exportBtn').classList.remove('hidden');$('meta').textContent=new Date().toLocaleString()}
function saveHistory(b,md){const h=JSON.parse(localStorage.getItem('scriptforge-history')||'[]');h.unshift({topic:b.split('\n')[0],date:new Date().toISOString(),md});localStorage.setItem('scriptforge-history',JSON.stringify(h.slice(0,20)))}
const toolPrompts={hooks:t=>`Generate 15 distinct hooks for "${t}" grouped by curiosity, contrarian, story, authority, problem and challenge. Explain why each works.`,titles:t=>`Generate 20 honest clickable titles for "${t}" across curiosity, benefit, search, story, list and bold angles.`,retention:t=>`Perform a retention audit for "${t}": beat map, likely drop-offs, weak transitions, open loops, pattern interrupts, payoff timing and concrete fixes.`,shots:t=>`Create a professional shot list for "${t}" with shot number, time, framing, camera movement, action, B-roll, props, lighting and edit notes.`,repurpose:t=>`Repurpose "${t}" into 5 Shorts/Reels, 5 social posts, 3 carousel concepts, 3 teasers and 3 newsletter/community angles.`,comments:t=>`Create 15 thoughtful discussion prompts, 5 pinned comments and 5 community posts for "${t}" without spammy engagement bait.`,package:t=>`Create a complete publishing package for "${t}": platform titles, description, thumbnail concepts, SEO keywords, hashtags, pinned comment, upload checklist and 3 short cutdowns.`};
async function runTool(){const t=$('toolTopic').value.trim()||$('topic').value.trim();if(!t)return;$('toolOutput').innerHTML='<div class="text-slate-400">'+(lang==='en'?'Working…':'处理中……')+'</div>';try{$('toolOutput').innerHTML=marked.parse(await ask('You are a senior creator strategist. Return concise actionable Markdown in '+(lang==='en'?'English':'Simplified Chinese')+'.',toolPrompts[activeTool](t),5000))}catch(e){$('toolOutput').innerHTML='<div class="text-red-600">'+e.message+'</div>'}}
function openModal(t,d,b){$('modalTitle').textContent=t;$('modalDesc').textContent=d;$('modalBody').innerHTML=b;$('modal').classList.remove('hidden');$('modal').classList.add('flex')}function closeModal(){$('modal').classList.add('hidden');$('modal').classList.remove('flex')}
async function inspire(){openModal(lang==='en'?'AI Inspiration':'AI 灵感',lang==='en'?'Eight fresh concepts':'8 个全新的创意方向','<div id="ideas">Generating…</div>');try{const raw=await ask('You are a viral video idea strategist. Return ONLY a valid JSON array.','Create exactly 8 genuinely different video concepts for '+($('topic').value.trim()||'a creator')+'. Each object: title, angle, hook, format, audience, why. Language: '+(lang==='en'?'English':'Simplified Chinese'),3000);const a=JSON.parse(raw.replace(/```json|```/g,'').trim());$('ideas').innerHTML=a.map((x,i)=>`<button class="text-left border rounded-xl p-4 hover:bg-slate-50" data-idea="${esc(x.title+'\n'+x.angle+'\nHook: '+x.hook)}"><b>${i+1}. ${esc(x.title)}</b><p class="text-sm text-slate-600 mt-1">${esc(x.angle)}</p><p class="text-xs text-indigo-600 mt-2">${esc(x.hook)}</p></button>`).join('');document.querySelectorAll('[data-idea]').forEach(b=>b.onclick=()=>{$('topic').value=b.dataset.idea;closeModal()})}catch(e){$('ideas').textContent=e.message}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function exportMenu(){openModal(L().exportTitle,L().exportDesc,`<div class="grid sm:grid-cols-2 gap-3"><button data-e="md" class="border rounded-xl p-4 text-left"><b>${L().md}</b></button><button data-e="txt" class="border rounded-xl p-4 text-left"><b>${L().txt}</b></button><button data-e="html" class="border rounded-xl p-4 text-left"><b>${L().html}</b></button><button data-e="pdf" class="border rounded-xl p-4 text-left"><b>${L().pdf}</b></button></div>`);document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>doExport(b.dataset.e))}
function doExport(t){if(!last)return;if(t==='pdf'){const w=window.open('','_blank');w.document.write('<html><head><title>ScriptForge</title><style>body{font-family:Arial;padding:40px;line-height:1.6}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:8px}</style></head><body>'+marked.parse(last)+'</body></html>');w.document.close();w.print();return}const data=t==='html'?'<!doctype html><html><body>'+marked.parse(last)+'</body></html>':t==='txt'?last.replace(/[#*_`]/g,''):last;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/plain'}));a.download='scriptforge-script.'+t;a.click();URL.revokeObjectURL(a.href);closeModal()}
$('generate').onclick=generate;$('runTool').onclick=runTool;$('inspireBtn').onclick=inspire;$('exportBtn').onclick=exportMenu;$('closeModal').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};$('copy').onclick=async()=>{await navigator.clipboard.writeText(last);$('meta').textContent=L().copied};$('clear').onclick=()=>{last='';$('output').innerHTML='';$('output').classList.add('hidden');$('empty').classList.remove('hidden');$('copy').classList.add('hidden');$('exportBtn').classList.add('hidden');$('meta').textContent=L().ready};$('historyBtn').onclick=()=>{const h=JSON.parse(localStorage.getItem('scriptforge-history')||'[]');if(!h.length)return alert(L().noHistory);const n=prompt(h.map((x,i)=>`${i+1}. ${x.topic} · ${new Date(x.date).toLocaleString()}`).join('\n')+'\n\nEnter number:');const i=Number(n)-1;if(h[i]){last=h[i].md;render(last)}};$('langBtn').onclick=()=>{lang=lang==='en'?'zh':'en';setup()};setup();
</script></body></html>
