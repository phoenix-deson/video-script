<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek 爆款视频脚本生成器</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js 用于解析 Markdown 输出 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans">

    <!-- Header -->
    <header class="bg-indigo-600 text-white py-6 shadow-md">
        <div class="max-w-5xl mx-auto px-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-2">
                    🎬 爆款视频脚本 AI 生成器
                </h1>
                <p class="text-xs text-indigo-200 mt-1">基于 DeepSeek AI · 纯静态 GitHub Pages 部署</p>
            </div>
            <button onclick="toggleSettings()" class="bg-indigo-700 hover:bg-indigo-800 text-xs px-3 py-2 rounded-lg transition border border-indigo-500">
                ⚙️ API 设置
            </button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-12 gap-6">

        <!-- 左侧：控制面板 -->
        <section class="md:col-span-5 bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit space-y-4">
            
            <!-- API Key 设置框 (默认隐蔽) -->
            <div id="settingsPanel" class="hidden bg-slate-100 p-4 rounded-lg border border-slate-300 space-y-2">
                <label class="block text-xs font-semibold text-slate-600">DeepSeek API Key:</label>
                <input type="password" id="apiKeyInput" placeholder="sk-..." class="w-full text-xs p-2 rounded border focus:outline-none focus:ring-1 focus:ring-indigo-500">
                <p class="text-[10px] text-slate-500">Key 将安全地保存在本地浏览器 (LocalStorage) 中，绝不上传。</p>
            </div>

            <!-- 视频类型选择 -->
            <div>
                <label class="block text-sm font-semibold mb-1 text-slate-700">脚本模式</label>
                <select id="scriptType" class="w-full text-sm p-2.5 rounded-lg border border-slate-300 bg-white focus:ring-2 focus:ring-indigo-500">
                    <option value="口播直录">真人出镜口播 (强观点/知识分享)</option>
                    <option value="单人旁白">单人纪录片/故事旁白 (画面配合画外音)</option>
                    <option value="情景对话">双人对话/小品戏剧 (冲突剧情)</option>
                    <option value="产品带货">短视频带货 (痛点+种草+转化)</option>
                </select>
            </div>

            <!-- 目标时长 & 风格 -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-sm font-semibold mb-1 text-slate-700">预计时长</label>
                    <select id="duration" class="w-full text-sm p-2.5 rounded-lg border border-slate-300 bg-white">
                        <option value="30秒短视频">30秒 (快节奏短视频)</option>
                        <option value="1分钟">1分钟 (黄金时长)</option>
                        <option value="3分钟中视频">3分钟 (深度科普/故事)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1 text-slate-700">语气风格</label>
                    <select id="tone" class="w-full text-sm p-2.5 rounded-lg border border-slate-300 bg-white">
                        <option value="幽默风趣，吸引眼球">幽默/爆款梗</option>
                        <option value="专业严谨，干货满满">专业/硬核科普</option>
                        <option value="情感共鸣，温暖治愈">情感/治愈系</option>
                        <option value="悬疑高能，层层反转">悬疑/反转剧情</option>
                    </select>
                </div>
            </div>

            <!-- 主题输入 + 灵感一下 -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-sm font-semibold text-slate-700">视频核心主题</label>
                    <button onclick="getRandomIdea()" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium flex items-center gap-1">
                        🎲 灵感一下
                    </button>
                </div>
                <textarea id="topicInput" rows="3" placeholder="例如：给打工人的提神咖啡推荐，或者讲述程序员如何防脱发..." class="w-full text-sm p-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
            </div>

            <!-- 生成按钮 -->
            <button id="generateBtn" onclick="generateScript()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg shadow transition flex items-center justify-center gap-2">
                ✨ 生成专业脚本
            </button>
        </section>

        <!-- 右侧：生成结果展示区 -->
        <section class="md:col-span-7 bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col min-h-[500px]">
            <div class="flex justify-between items-center pb-4 border-b border-slate-100">
                <h2 class="font-semibold text-slate-800">📜 生成的脚本</h2>
                <div id="actionBtns" class="hidden gap-2">
                    <button onclick="copyToClipboard()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded transition">📋 复制</button>
                </div>
            </div>

            <!-- 内容输出区 -->
            <div id="outputContainer" class="mt-4 flex-1 overflow-auto text-slate-700 text-sm leading-relaxed prose max-w-none">
                <div id="placeholder" class="text-center py-20 text-slate-400">
                    <p class="text-4xl mb-2">💡</p>
                    <p>在左侧选择模式并输入主题，点击生成脚本</p>
                </div>
                <div id="loading" class="hidden text-center py-20 text-indigo-600">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-600 border-t-transparent"></div>
                    <p class="mt-3 text-sm font-medium">DeepSeek 构思脚本中，请稍候...</p>
                </div>
                <div id="scriptContent" class="hidden"></div>
            </div>
        </section>
    </main>

    <script>
        // 初始化读取 API Key
        document.addEventListener("DOMContentLoaded", () => {
            const savedKey = localStorage.getItem("deepseek_api_key");
            if (savedKey) {
                document.getElementById("apiKeyInput").value = savedKey;
            } else {
                document.getElementById("settingsPanel").classList.remove("hidden");
            }
        });

        // 切换设置面板显示
        function toggleSettings() {
            const panel = document.getElementById("settingsPanel");
            panel.classList.toggle("hidden");
        }

        // 灵感生成器
        const ideas = [
            "普通打工人如何在下班后通过副业赚到第一个1000块？",
            "如果人工智能拥有了情感，人类的最后一道防线是什么？",
            "3个被大多数人误解的健康饮食冷知识",
            "沉浸式体验：现代人一天不上网会发生什么？",
            "极简主义生活半年后，我的心态发生了哪些改变？",
            "适合新手入门的3款高效提升办公效率的免费工具"
        ];
        function getRandomIdea() {
            const randomIndex = Math.floor(Math.random() * ideas.length);
            document.getElementById("topicInput").value = ideas[randomIndex];
        }

        // 复制到剪贴板
        function copyToClipboard() {
            const content = document.getElementById("scriptContent").innerText;
            navigator.clipboard.writeText(content).then(() => {
                alert("脚本已复制到剪贴板！");
            });
        }

        // 主逻辑：调用 DeepSeek API 生成脚本
        async function generateScript() {
            const apiKey = document.getElementById("apiKeyInput").value.trim();
            const type = document.getElementById("scriptType").value;
            const duration = document.getElementById("duration").value;
            const tone = document.getElementById("tone").value;
            const topic = document.getElementById("topicInput").value.trim();

            if (!apiKey) {
                alert("请先设置 DeepSeek API Key！");
                document.getElementById("settingsPanel").classList.remove("hidden");
                return;
            }
            if (!topic) {
                alert("请输入视频主题或点击『灵感一下』！");
                return;
            }

            // 保存 Key
            localStorage.setItem("deepseek_api_key", apiKey);

            // UI 切换
            document.getElementById("placeholder").classList.add("hidden");
            document.getElementById("scriptContent").classList.add("hidden");
            document.getElementById("loading").classList.remove("hidden");
            document.getElementById("generateBtn").disabled = true;

            // Prompt 组装
            const systemPrompt = `你是一位顶尖的自媒体短视频编导与爆款文案大师。请根据用户提供的需求，输出一份专业、结构清晰且极具吸引力的视频脚本。`;
            const userPrompt = `
请为我创作一份视频脚本，要求如下：
1. **视频模式**：${type}
2. **预计时长**：${duration}
3. **语气风格**：${tone}
4. **视频主题**：${topic}

**输出格式要求**：
- **标题建议**：提供 3 个极具吸引力、点击率高的爆款标题。
- **黄金前3秒 hook**：设计强有力的开场吸睛点。
- **脚本正文**：请使用 Markdown 表格呈现，列名必须包含：
  | 镜号 | 画面/拍摄动作 | 语音/台词内容 | 音效/BGM提示 |
- **结尾 CTA (行动呼吁)**：引导点赞、关注或互动。
            `;

            try {
                const response = await fetch("https://api.deepseek.com/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "deepseek-chat",
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: userPrompt }
                        ],
                        temperature: 0.7
                    })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error?.message || "请求失败，请检查 API Key 或网络环境。");
                }

                const data = await response.json();
                const markdownText = data.choices[0].message.content;

                // 渲染渲染 Markdown
                document.getElementById("scriptContent").innerHTML = marked.parse(markdownText);
                document.getElementById("scriptContent").classList.remove("hidden");
                document.getElementById("actionBtns").classList.remove("hidden");

            } catch (err) {
                alert("发生错误: " + err.message);
                document.getElementById("placeholder").classList.remove("hidden");
            } finally {
                document.getElementById("loading").classList.add("hidden");
                document.getElementById("generateBtn").disabled = false;
            }
        }
    </script>
</body>
</html>
