function md(v){let s=String(v??'').replace(/\r/g,''),lines=s.split('\n'),out='',i=0;while(i<lines.length){let l=lines[i];if(!l.trim()){i++;continue}if(/^```/.test(l)){let code=[];i++;while(i<lines.length&&!/^```/.test(lines[i]))code.push(lines[i++]);i++;out+='<pre><code>'+esc(code.join('\n'))+'</code></pre>';continue}let hm=l.match(/^(#{1,3})\s+(.*)$/);if(hm){out+=`<h${hm[1].length}>${inline(hm[2])}</h${hm[1].length}>`;i++;continue}if(/^\s*>/.test(l)){let q=[];while(i<lines.length&&/^\s*>/.test(lines[i]))q.push(lines[i++].replace(/^\s*>\s?/,''));out+='<blockquote>'+q.map(inline).join('<br>')+'</blockquote>';continue}if(/^\s*[-*]\s+/.test(l)){let a=[];while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i]))a.push(lines[i++].replace(/^\s*[-*]\s+/,''));out+='<ul>'+a.map(x=>'<li>'+inline(x)+'</li>').join('')+'</ul>';continue}if(/^\s*\d+[.)]\s+/.test(l)){let a=[];while(i<lines.length&&/^\s*\d+[.)]\s+/.test(lines[i]))a.push(lines[i++].replace(/^\s*\d+[.)]\s+/,''));out+='<ol>'+a.map(x=>'<li>'+inline(x)+'</li>').join('')+'</ol>';continue}if(l.includes('|')&&i+1<lines.length&&/^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?\s*$/.test(lines[i+1])){let row=x=>x.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim()),head=row(l);i+=2;let rows=[];while(i<lines.length&&lines[i].includes('|')&&lines[i].trim()){rows.push(row(lines[i++]));}out+='<div class="table-wrap"><table><thead><tr>'+head.map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+head.map((_,n)=>'<td>'+inline(r[n]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';continue}let p=[l];i++;while(i<lines.length&&lines[i].trim()&&!/^(#{1,3})\s|^\s*[-*]\s+|^\s*\d+[.)]\s+|^\s*>|^```/.test(lines[i])&&!(lines[i].includes('|')&&i+1<lines.length&&/^\s*\|?\s*:?-+:?/.test(lines[i+1])))p.push(lines[i++]);out+='<p>'+p.map(inline).join('<br>')+'</p>'}return out}

}
function save(b,m){const h=JSON.parse(localStorage.getItem('scriptforge-history')||'[]');h.unshift({topic:b.split('\n')[0],date:new Date().toISOString(),md:m});localStorage.setItem('scriptforge-history',JSON.stringify(h.slice(0,20)))}
const prompts={hooks:t=>`Generate 10 strong video hooks for "${t.slice(0,1200)}". Keep each under 18 words.`,titles:t=>`Generate 10 clickable but honest video titles for "${t.slice(0,1200)}". Keep each under 12 words.`,retention:t=>`Audit retention for "${t.slice(0,1200)}" with a compact beat map, likely drop-offs and concrete fixes.`,shots:t=>`Create a practical shot list for "${t.slice(0,1200)}" with shot, framing, movement, action and B-roll.`,repurpose:t=>`Give 5 concise ways to repurpose "${t.slice(0,1200)}" into short-form and social content.`,comments:t=>`Give 6 thoughtful discussion prompts and 2 pinned-comment ideas for "${t.slice(0,1200)}" without spam.`,package:t=>`Create a concise publishing package for "${t.slice(0,1200)}": 5 titles, 2 thumbnail concepts, short description, keywords and hashtags.`};
async function runTool(){const q=$('toolTopic').value.trim()||$('topic').value.trim();if(!q)return alert(T().noTopic);$('toolOutput').innerHTML='<p class="text-slate-400">'+T().working+'</p>';try{$('toolOutput').innerHTML=md(await ask('You are a senior creator strategist. Return concise, actionable Markdown in '+(lang==='en'?'English':'Simplified Chinese')+'. No filler or repetition.',prompts[tool](q),AI_CONFIG.toolMaxTokens))}catch(e){$('toolOutput').innerHTML='<p class="text-red-600">'+esc(e.message)+'</p>'}}
function openModal(t,d,b){$('modalTitle').textContent=t;$('modalDesc').textContent=d;$('modalBody').innerHTML=b;$('modal').classList.remove('hidden');$('modal').classList.add('flex')}function closeModal(){$('modal').classList.add('hidden');$('modal').classList.remove('flex')}
async function inspire(){openModal(T().ideasTitle,T().ideasDesc,'<div id="ideas" class="grid gap-3"><p class="text-slate-400">'+T().working+'</p></div>');try{const raw=await ask('You are a video idea strategist. Return ONLY a valid JSON array. No markdown, no explanation.','Create exactly 6 short video topic/title ideas for '+($('topic').value.trim().slice(0,1200)||'a creator')+'. Each object must contain only title and angle. Keep title under 12 words and angle under 18 words. Language: '+(lang==='en'?'English':'Simplified Chinese'),AI_CONFIG.inspirationMaxTokens);let a;try{a=JSON.parse(raw.replace(/```json|```/g,'').trim())}catch{throw new Error('Could not parse AI inspiration results.')}if(!Array.isArray(a))throw new Error('Invalid inspiration format.');$('ideas').innerHTML=a.slice(0,6).map((x,i)=>`<button class="idea text-left border rounded-xl p-4" data-idea="${esc(x.title||'')}"><b>${i+1}. ${esc(x.title||'')}</b><p class="text-sm text-slate-600 mt-1">${esc(x.angle||'')}</p><span class="text-xs text-indigo-600 mt-2 block">Click to use</span></button>`).join('');document.querySelectorAll('[data-idea]').forEach(b=>b.onclick=()=>{$('topic').value=b.dataset.idea;closeModal();$('topic').focus()})}catch(e){$('ideas').innerHTML='<p class="text-red-600">'+esc(e.message)+'</p>'}}
function exportMenu(){openModal(T().export,T().export,'<div class="grid sm:grid-cols-2 gap-3"><button data-e="md" class="border rounded-xl p-4 text-left"><b>Markdown</b></button><button data-e="txt" class="border rounded-xl p-4 text-left"><b>Plain text</b></button><button data-e="html" class="border rounded-xl p-4 text-left"><b>HTML</b></button><button data-e="pdf" class="border rounded-xl p-4 text-left"><b>Print / PDF</b></button></div>');document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>doExport(b.dataset.e))}
function doExport(t){if(!last)return;if(t==='pdf'){const w=window.open('','_blank');w.document.write('<html><head><title>ScriptForge</title><style>body{font-family:Arial;padding:40px;line-height:1.6}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:8px}</style></head><body>'+md(last)+'</body></html>');w.document.close();w.print();return}let data=t==='html'?'<!doctype html><html><body>'+md(last)+'</body></html>':t==='txt'?last.replace(/[#*_`]/g,''):last;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:t==='html'?'text/html':'text/plain'}));a.download='scriptforge-script.'+t;a.click();URL.revokeObjectURL(a.href);closeModal()}
$('generate').onclick=generate;$('run').onclick=runTool;$('inspire').onclick=inspire;$('export').onclick=exportMenu;$('close').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(last);$('meta').textContent=T().copied}catch(e){alert(last)}};$('clear').onclick=()=>{last='';$('output').innerHTML='';$('output').classList.add('hidden');$('loading').classList.add('hidden');$('empty').classList.remove('hidden');$('copy').classList.add('hidden');$('export').classList.add('hidden');$('meta').textContent=T().ready};$('history').onclick=()=>{const h=JSON.parse(localStorage.getItem('scriptforge-history')||'[]');if(!h.length)return alert(T().noHistory);const n=prompt(h.map((x,i)=>`${i+1}. ${x.topic} · ${new Date(x.date).toLocaleString()}`).join('\n')+'\n\nEnter number:');const x=h[Number(n)-1];if(x){show(x.md)}};$('language').onclick=()=>{lang=lang==='en'?'zh':'en';setup()};setup();
</script></body></html>
