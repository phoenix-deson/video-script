function show(v){last=String(v||'');$('loading').classList.add('hidden');$('empty').classList.add('hidden');$('output').classList.remove('hidden');$('output').innerHTML=md(last);$('copy').classList.remove('hidden');$('export').classList.remove('hidden');$('meta').textContent=new Date().toLocaleString()}
async function generate(){if(!$('topic').value.trim())return alert(T().noTopic);$('generate').disabled=true;$('empty').classList.add('hidden');$('output').classList.add('hidden');$('loading').classList.remove('hidden');$('status').textContent=T().working;try{let q=brief(),d=$('duration').value,b=budget(d),ul=detectLanguage($('topic').value),full=$('detailMode').checked;let analysis=await ask(`You are Agent 1, the Brief Analyst inside ScriptForge. Analyze the user's request before any script is written. Return ONLY a compact internal production brief for Agent 2. Do not write the final script. Extract: core promise, viewer, desired action, strongest hook angle, narrative spine, retention beats, emotional progression, proof/example needs, CTA strategy, format constraints, duration budget and factual risks. Preserve the user's language. Be concrete and decisive. ${SKILL.rules.facts} ${SKILL.rules.duration}`,q,Math.min(1800,Math.max(700,Math.floor(b*.45))));let system=full?`You are Agent 2, the Script Producer inside ScriptForge. Agent 1 has analyzed the request. Create ONLY the FINAL PRODUCTION SCRIPT. This must be directly usable by a creator without rewriting. Write entirely in ${ul==='zh'?'Simplified Chinese':'English'}. Include timestamps, scene/action, framing/camera, exact spoken words, on-screen text, B-roll and edit/audio cues. Every spoken line must be natural and performable. Cover the full selected duration without padding. Start with the hook and build setup, development, payoff and CTA. Do not show analysis. Do not repeat the brief. Do not add generic AI commentary. ${SKILL.rules.professional} ${SKILL.rules.voice} ${SKILL.rules.facts}`:`You are Agent 2, an elite professional video scriptwriter inside ScriptForge. Agent 1 has analyzed the request. Deliver ONLY the FINAL SCRIPT a creator can read aloud and record immediately. Write entirely in ${ul==='zh'?'Simplified Chinese':'English'}. No analysis, explanation, suggestions, titles, SEO, hashtags, production commentary or filler. Use natural spoken language and compact timestamps. Start immediately with the hook. Build a clear beginning, development, payoff and ending. The selected duration is a HARD constraint. For 30 seconds target <=75 English words or <=150 Chinese characters and 6-10 short timestamped lines. Finish within the duration. ${SKILL.rules.short} ${SKILL.rules.voice} ${SKILL.rules.facts}`;let final=await ask(system,`USER BRIEF:\n${q}\n\nINTERNAL AGENT 1 ANALYSIS:\n${analysis}\n\nProduce the final output now.`,full?Math.min(6000,Math.max(900,b*2)):b);show(final);save(q,final)}catch(e){show('## '+T().error+'\n\n'+e.message)}finally{$('generate').disabled=false;$('status').textContent=T().ready}}
function save(b,m){let h=JSON.parse(localStorage.getItem('scriptforge-history')||'[]');h.unshift({topic:b.split('\n')[1]||b,date:new Date().toISOString(),md:m});localStorage.setItem('scriptforge-history',JSON.stringify(h.slice(0,20)))}
const prompts={hooks:t=>`Generate 10 strong video hooks for "${t.slice(0,1200)}". Keep each under 18 words.`,titles:t=>`Generate 10 clickable but honest video titles for "${t.slice(0,1200)}". Keep each under 12 words.`,retention:t=>`Audit retention for "${t.slice(0,1200)}" with a compact beat map, likely drop-offs and concrete fixes.`,shots:t=>`Create a practical shot list for "${t.slice(0,1200)}" with shot, framing, movement, action and B-roll.`,repurpose:t=>`Give 5 concise ways to repurpose "${t.slice(0,1200)}" into short-form and social content.`,comments:t=>`Give 6 thoughtful discussion prompts and 2 pinned-comment ideas for "${t.slice(0,1200)}" without spam.`,package:t=>`Create a concise publishing package for "${t.slice(0,1200)}": 5 titles, 2 thumbnail concepts, short description, keywords and hashtags.`};async function runTool(){let q=$('toolTopic').value.trim()||$('topic').value.trim();if(!q)return alert(T().noTopic);$('toolOutput').innerHTML='<p class="text-slate-400">'+T().working+'</p>';try{$('toolOutput').innerHTML=md(await ask('You are a senior creator strategist. Return concise actionable Markdown in '+(detectLanguage(q)==='zh'?'Simplified Chinese':'English')+'. No filler.',prompts[tool](q),AI_CONFIG.toolMaxTokens))}catch(e){$('toolOutput').innerHTML='<p class="text-red-600">'+esc(e.message)+'</p>'}}function openModal(t,d,b){$('modalTitle').textContent=t;$('modalDesc').textContent=d;$('modalBody').innerHTML=b;$('modal').classList.remove('hidden');$('modal').classList.add('flex')}function closeModal(){$('modal').classList.add('hidden');$('modal').classList.remove('flex')}async function inspire(){openModal(T().ideasTitle,T().ideasDesc,'<div id="ideas"><p class="text-slate-400">'+T().working+'</p></div>');try{let raw=await ask('You are a video idea strategist. Return ONLY a valid JSON array. No markdown or explanation.','Create exactly 6 short video topic/title ideas for '+($('topic').value.trim().slice(0,1200)||'a creator')+'. Each object contains only title and angle. Language: '+(detectLanguage($('topic').value)==='zh'?'Simplified Chinese':'English'),AI_CONFIG.inspirationMaxTokens),a=JSON.parse(raw.replace(/```json|```/g,'').trim());$('ideas').innerHTML=a.slice(0,6).map((x,i)=>`<button class="idea text-left border rounded-xl p-4 w-full" data-idea="${esc(x.title||'')}"><b>${i+1}. ${esc(x.title||'')}</b><p class="text-sm text-slate-600 mt-1">${esc(x.angle||'')}</p></button>`).join('');document.querySelectorAll('[data-idea]').forEach(b=>b.onclick=()=>{$('topic').value=b.dataset.idea;closeModal();$('topic').focus()})}catch(e){$('ideas').innerHTML='<p class="text-red-600">'+esc(e.message)+'</p>'}}function exportMenu(){openModal(T().export,T().export,'<div class="grid sm:grid-cols-2 gap-3"><button data-e="md" class="border rounded-xl p-4">Markdown</button><button data-e="txt" class="border rounded-xl p-4">Plain text</button><button data-e="html" class="border rounded-xl p-4">HTML</button><button data-e="pdf" class="border rounded-xl p-4">Print / PDF</button></div>');document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>doExport(b.dataset.e))}function doExport(t){if(!last)return;if(t==='pdf'){let w=window.open('','_blank');w.document.write('<html><body style="font-family:Arial;padding:40px">'+md(last)+'</body></html>');w.document.close();w.print();return}let data=t==='html'?'<!doctype html><html><body>'+md(last)+'</body></html>':t==='txt'?last.replace(/[#*_`]/g,''):last,a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:t==='html'?'text/html':'text/plain'}));a.download='scriptforge-script.'+t;a.click();URL.revokeObjectURL(a.href);closeModal()}
$('generate').onclick=generate;$('run').onclick=runTool;$('inspire').onclick=inspire;$('export').onclick=exportMenu;$('close').onclick=closeModal;$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(last);$('meta').textContent=T().copied}catch(e){alert(last)}};$('clear').onclick=()=>{last='';$('output').innerHTML='';$('output').classList.add('hidden');$('loading').classList.add('hidden');$('empty').classList.remove('hidden');$('copy').classList.add('hidden');$('export').classList.add('hidden')};$('history').onclick=()=>{let h=JSON.parse(localStorage.getItem('scriptforge-history')||'[]');if(!h.length)return alert(T().noHistory);let n=prompt(h.map((x,i)=>`${i+1}. ${x.topic} · ${new Date(x.date).toLocaleString()}`).join('\n')+'\n\nEnter number:');let x=h[Number(n)-1];if(x)show(x.md)};$('language').onclick=()=>{lang=lang==='en'?'zh':'en';setup()};$('detailMode').onchange=()=>{$('modeDesc').textContent=T()[$('detailMode').checked?'modeOn':'modeOff']};setup();
</script></body></html>
