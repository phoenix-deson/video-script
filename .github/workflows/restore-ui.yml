name: restore-ui
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore UI and logic
        shell: bash
        run: |
          set -e
          git show eb924b507cb68424155a04ef8471a751b8810341:index.html > index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          # Add polished toggle styling before the existing style block closes.
          css='.mode-card{margin-top:14px;padding:12px 14px;border:1px solid #e2e8f0;border-radius:14px;background:#f8fafc}.mode-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.mode-copy{min-width:0}.mode-title{font-size:13px;font-weight:800}.mode-desc{font-size:11px;color:#64748b;margin-top:3px}.mode-switch{position:relative;width:46px;height:26px;display:inline-block;flex:none}.mode-switch input{opacity:0;width:0;height:0}.mode-slider{position:absolute;inset:0;background:#cbd5e1;border-radius:999px;cursor:pointer;transition:.2s}.mode-slider:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;box-shadow:0 1px 4px rgba(15,23,42,.18);transition:.2s}.mode-switch input:checked+.mode-slider{background:#4f46e5}.mode-switch input:checked+.mode-slider:before{transform:translateX(20px)}'
          s=s.replace('</style>',''+css+'</style>',1)
          # Put the switch immediately above Generate, preserving every original control.
          marker='<button id="generate"'
          card='<div class="mode-card"><div class="mode-row"><div class="mode-copy"><div class="mode-title">Output detail</div><div class="mode-desc">Off: spoken script only · On: full production package</div></div><label class="mode-switch"><input id="detailMode" type="checkbox"><span class="mode-slider"></span></label></div></div>'
          if 'id="detailMode"' not in s:
              s=s.replace(marker,card+marker,1)
          # Keep the original full-production implementation intact, and wrap it with a concise mode.
          needle='async function generate(){'
          if needle not in s:
              raise SystemExit('generate() not found')
          s=s.replace(needle,'async function generateOriginal(){',1)
          wrapper="""async function generate(){
            if($('detailMode') && !$('detailMode').checked){
              if(!$('topic').value.trim()) return alert(T().noTopic);
              $('generate').disabled=true;
              $('empty').classList.add('hidden'); $('output').classList.add('hidden'); $('loading').classList.remove('hidden'); $('status').textContent=T().working;
              try{
                const duration=$('duration').value;
                const budget={'30 seconds':320,'60 seconds':480,'90 seconds':620,'3 minutes':1050,'5 minutes':1600,'8 minutes':2400,'10 minutes':3000,'15 minutes':4200,'20 minutes':5400}[duration]||650;
                const briefText=brief();
                const system='You are an elite short-form video script writer. Return ONLY the spoken narration/dialogue in clean Markdown with compact timestamps. Do not output shot lists, B-roll, framing, camera movement, editing notes, retention analysis, titles, thumbnails, SEO, hashtags, upload checklists, explanations, or AI commentary. Never pad the script. The spoken content must naturally fit the selected duration.';
                const user='Write the final spoken script for this brief:\\n'+briefText+'\\n\\nSTRICT LENGTH: maximum '+budget+' output tokens. For 30 seconds, target no more than 75 English words or 150 Chinese characters and 6–10 short timestamped lines. Finish within the selected duration. Output only what the speaker actually says.';
                const r=await ask(system,user,budget); show(r); save(briefText,r);
              }catch(e){show('## '+T().error+'\\n\\n'+e.message)}finally{$('generate').disabled=false;$('status').textContent=T().ready}
              return;
            }
            return generateOriginal();
          }
          """
          s=s.replace('function save(',wrapper+'function save(',1)
          # Store mode state locally.
          s=s.replace("setup();","setup();$('detailMode').checked=localStorage.getItem('scriptforge-detail-mode')==='1';$('detailMode').onchange=()=>localStorage.setItem('scriptforge-detail-mode',$('detailMode').checked?'1':'0');",1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore polished UI and working concise full modes"
          git push
          rm -f .github/workflows/restore-ui.yml
          git add .github/workflows/restore-ui.yml
          git commit -m "chore: remove restoration workflow"
          git push
